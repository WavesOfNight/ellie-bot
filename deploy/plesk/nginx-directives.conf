# Ellie [BOT] — à coller dans Plesk :
#   Sites Web et domaines → <ton domaine> → Paramètres Apache & nginx → « Directives nginx supplémentaires »
# Le panel Next.js tourne en local (service systemd ellie-web) ; nginx de Plesk fait le HTTPS et transmet.
# « location ~ ^/ » (regex) est volontaire : elle passe avant le « location / » généré par Plesk,
# tandis que « /.well-known/acme-challenge/ » (Let's Encrypt) reste prioritaire.
location ~ ^/ {
    proxy_pass http://127.0.0.1:__WEB_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 90s;
    client_max_body_size 5m;
}
